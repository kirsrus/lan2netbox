# Taskfile: сборка и обслуживание lan2netbox (https://taskfile.dev)
version: '3'

vars:
  APP: lan2netbox
  # Выходная директория для бинарников.
  DIST: build
  # Версия из последнего git-тега; при отсутствии тегов — хеш коммита.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  # Дата сборки в локальном часовом поясе (RFC3339); при недоступности date — "unknown".
  BUILD_DATE:
    sh: date +%FT%T%:z 2>/dev/null || echo unknown
  LDFLAGS: >-
    -s -w
    -X github.com/kirsrus/lan2netbox/internal/version.Version={{.VERSION}}
    -X github.com/kirsrus/lan2netbox/internal/version.Commit={{.COMMIT}}
    -X github.com/kirsrus/lan2netbox/internal/version.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    desc: Сборка бинарника для Linux
    cmds:
      - task: build

  build:
    desc: Сборка бинарника для Linux в build/
    cmds:
      - task: prepare
      - task: build-linux
      - task: setcap

  prepare:
    desc: Создание выходной директории
    internal: true
    cmds:
      - cmd: mkdir -p {{.DIST}}
        platforms: [linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DIST}}' | Out-Null"
        platforms: [windows]

  build-linux:
    desc: Сборка бинарника для Linux (amd64)
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.APP}} .
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"

  setcap:
    desc: Установка привилегий cap_net_raw для бинарника
    internal: true
    cmds:
      - cmd: sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service=eip {{.DIST}}/{{.APP}}
        platforms: [linux]

  build-host:
    desc: Сборка бинарника для текущей ОС
    cmds:
      - task: prepare
      - cmd: go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.APP}} .
        platforms: [linux]
      - cmd: go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.APP}}.exe .
        platforms: [windows]

  run:
    desc: Сборка и запуск приложения (Linux; без configs/config.yaml — значения по умолчанию)
    deps: [build-host]
    vars:
      # Путь к файлу конфигурации: task run CONFIG=configs/my.yaml
      CONFIG_FLAG: '{{if .CONFIG}}--config {{.CONFIG}}{{end}}'
    cmds:
      - task: setcap
      - cmd: ./{{.DIST}}/{{.APP}} run {{.CONFIG_FLAG}}
        platforms: [linux]

  version:
    desc: Сборка и вывод версии (Linux)
    deps: [build]
    cmds:
      - cmd: ./{{.DIST}}/{{.APP}} version
        platforms: [linux]

  clean:
    desc: Удаление выходной директории build/
    cmds:
      - cmd: rm -rf {{.DIST}}
        platforms: [linux]
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.DIST}}' -ErrorAction SilentlyContinue"
        platforms: [windows]

  test:
    desc: Запуск тестов
    cmds:
      - go test ./...

  lint:
    desc: Статический анализ (golangci-lint)
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Обновление go.mod/go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Форматирование исходников
    cmds:
      - gofmt -l -w .